inside the wall, and a crack in the plaster is the way in. Refuses the
"coming soon" card, the progress bar, the countdown.
OWN-WORLD: Freshly skimmed plaster, still drying: pink where it has dried,
brown-pink where it is wet, trowel sheen, grit. Warm graphite ink. The only
cool colour on the page is the desktop's bone-and-indigo field, seen through
the crack.
STORY: A visitor reads that the site is under works, sees that the desktop
can still be reached, and goes through the crack. Someone who only wants the
résumé finds it on the sign at the foot of the wall.
FIRST VIEWPORT: "Under works." large at the upper left, the aside under it,
a pencil arrow down to a small crack right of centre, the sign along the
foot. The crack is the primary action.
FORM: A wall. Pinned by the user on 28 Oct 2026; no roll.
