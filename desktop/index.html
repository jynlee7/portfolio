<!doctype html>
<html lang="en" data-desk="tangerine">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jayden Lee · Desktop</title>
    <meta
      name="description"
      content="Jayden Lee's desktop: a working machine from about 2001, with his résumé, projects and experience as files on it."
    />
    <link rel="preload" href="/fonts/GeneralSans-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The desktop is an enhancement. Without the `js` class the stylesheet
         renders every document as a plain vertical page, so a script failure
         costs the visitor the metaphor, never the content.

         Everything here has to be decided before the first paint: the flavour,
         so the wrong wallpaper never flashes; `is-booting`, so a cold visit's first
         frame is already the boot; and `awake`, so a return visit's is the desk.
         If the module never starts, the watchdog falls back to the plain page. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        function read(store, key) {
          try {
            return window[store].getItem(key);
          } catch (e) {
            return null;
          }
        }
        var desk = read("localStorage", "jl.desk");
        if (desk && /^(tangerine|bondi|grape|lime|strawberry|graphite)$/.test(desk)) root.dataset.desk = desk;
        var deep = location.hash.length > 1;
        var woke = read("sessionStorage", "jl.woke") === "1";
        if (woke || deep) root.classList.add("awake");
        else if (read("sessionStorage", "jl.booted") !== "1" && !matchMedia("(prefers-reduced-motion: reduce)").matches) root.classList.add("is-booting");
        setTimeout(function () {
          if ("running" in root.dataset) return;
          root.classList.remove("js", "is-booting", "awake");
        }, 8000);
      })();
    </script>
  </head>

  <body>
    <a class="desktop-return" href="/">← Back to portfolio</a>
    <a class="skip" href="#docs">Skip to content</a>

    <!-- ============================================================
         ICON SPRITE
         Drawn in the period's own grammar: an object, lit from above, with a
         hard highlight across its top and a soft glow in its base. Colour comes
         in through --tint, so each folder can be its own flavour.
         ============================================================ -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="g-gloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".85" />
          <stop offset="1" stop-color="#fff" stop-opacity=".12" />
        </linearGradient>
        <linearGradient id="g-glow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0" />
          <stop offset="1" stop-color="#fff" stop-opacity=".5" />
        </linearGradient>
        <linearGradient id="g-shade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#000" stop-opacity="0" />
          <stop offset="1" stop-color="#000" stop-opacity=".3" />
        </linearGradient>
        <linearGradient id="g-sheet" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" />
          <stop offset="1" stop-color="#e4e6ea" />
        </linearGradient>
        <linearGradient id="g-screen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22303a" />
          <stop offset="1" stop-color="#0a1218" />
        </linearGradient>

        <symbol id="i-folder" viewBox="0 0 64 64">
          <path d="M6 16a4 4 0 0 1 4-4h14l5 6h25a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="var(--tint)" />
          <path d="M6 16a4 4 0 0 1 4-4h14l5 6h25a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="url(#g-shade)" />
          <path d="M6 26a4 4 0 0 1 4-4h44a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="var(--tint)" />
          <path d="M6 26a4 4 0 0 1 4-4h44a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="url(#g-glow)" />
          <path d="M8.500 26a2.500 2.500 0 0 1 2.500-2.500h42a2.500 2.500 0 0 1 2.500 2.500v8c-14 4-33 4-47 0z" fill="url(#g-gloss)" />
          <path d="M6 16a4 4 0 0 1 4-4h14l5 6h25a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="none" stroke="#000" stroke-opacity=".38" />
        </symbol>

        <!-- this-site: a candy-coloured monitor with this desk's window on it,
             because the project is the machine you are looking at. -->
        <symbol id="i-win" viewBox="0 0 64 64">
          <path d="M12 8h40a8 8 0 0 1 8 8v28a10 10 0 0 1-10 10H14A10 10 0 0 1 4 44V16a8 8 0 0 1 8-8z" fill="var(--tint)" />
          <path d="M12 8h40a8 8 0 0 1 8 8v28a10 10 0 0 1-10 10H14A10 10 0 0 1 4 44V16a8 8 0 0 1 8-8z" fill="url(#g-glow)" />
          <rect x="11" y="13" width="42" height="31" rx="4" fill="url(#g-screen)" />
          <rect x="16" y="18" width="24" height="18" rx="1.500" fill="#f6f6f6" />
          <rect x="16" y="18" width="24" height="4" rx="1.500" fill="#d6d6da" />
          <circle cx="18.500" cy="20" r="1" fill="#f4493e" />
          <circle cx="21.500" cy="20" r="1" fill="#f6b52c" />
          <circle cx="24.500" cy="20" r="1" fill="#35b94a" />
          <path d="M11 17a4 4 0 0 1 4-4h34a4 4 0 0 1 4 4v3c-13 6-29 7-42 3z" fill="#fff" fill-opacity=".14" />
          <path d="M12 9h40a7 7 0 0 1 7 6c-12-3-42-3-54 0a7 7 0 0 1 7-6z" fill="url(#g-gloss)" />
          <path d="M26 54h12l3 5H23z" fill="var(--tint)" />
          <path d="M12 8h40a8 8 0 0 1 8 8v28a10 10 0 0 1-10 10H14A10 10 0 0 1 4 44V16a8 8 0 0 1 8-8z" fill="none" stroke="#000" stroke-opacity=".38" />
        </symbol>

        <!-- Page silhouette shared by every document icon. -->
        <symbol id="i-page" viewBox="0 0 64 64">
          <path d="M14 4h26l14 14v40a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="url(#g-sheet)" stroke="#000" stroke-opacity=".42" />
          <path d="M40 4v12a2 2 0 0 0 2 2h12z" fill="#cdd2d9" stroke="#000" stroke-opacity=".36" stroke-linejoin="round" />
        </symbol>

        <symbol id="i-pdf" viewBox="0 0 64 64">
          <use href="#i-page" />
          <rect x="6" y="32" width="40" height="17" rx="3" fill="#d42a22" />
          <rect x="6" y="32" width="40" height="8" rx="3" fill="url(#g-gloss)" />
          <text x="26" y="45" text-anchor="middle" font-family="General Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">PDF</text>
        </symbol>

        <!-- experience.log: a page carrying a step plot, because the file is a
             record of things that happened in sequence. -->
        <symbol id="i-log" viewBox="0 0 64 64">
          <use href="#i-page" />
          <path d="M18 50h7v-9h8v-11h8v-7h9" fill="none" stroke="#1464d8" stroke-width="3.500" stroke-linejoin="round" stroke-linecap="round" />
          <circle cx="50" cy="23" r="3.200" fill="#1464d8" />
        </symbol>

        <symbol id="i-txt" viewBox="0 0 64 64">
          <use href="#i-page" />
          <g stroke="#8a8f98" stroke-width="2.600" stroke-linecap="round">
            <path d="M19 30h28" />
            <path d="M19 37h28" />
            <path d="M19 44h28" />
            <path d="M19 51h16" />
          </g>
          <path d="M19 22h14" stroke="#1464d8" stroke-width="3.400" stroke-linecap="round" />
        </symbol>
      </defs>
    </svg>

    <!-- ============================================================
         THE GROUND
         The wallpaper and, once it has drawn, the gel canvas (src/os/gel.ts):
         the name moulded in clear plastic and the drop that bends it.
         ============================================================ -->
    <div class="ground" id="ground" aria-hidden="true">
      <canvas class="ground__gel" id="gel"></canvas>
    </div>

    <!-- ============================================================
         THE BOOT
         What a first visit sees for about two seconds (src/os/boot.ts). The
         bar fills from real work and the row is read off the desk. Hidden from
         assistive technology: the login behind it is the first real thing here.
         ============================================================ -->
    <div class="boot" id="boot" aria-hidden="true">
      <div class="boot__stage">
        <div class="boot__parade" id="boot-parade"></div>
        <div class="boot__bar" id="boot-bar"><div class="boot__fill" id="boot-fill"></div></div>
        <p class="boot__status"><span id="boot-status">Starting up</span><span class="num" id="boot-pct">0%</span></p>
      </div>
    </div>

    <!-- ============================================================
         THE LOGIN
         The first thing that stays. The name is the desk's own, under this; here
         is only what a stranger needs before deciding to look: the time this
         machine keeps, one sentence, and the default button.

         `hidden` by default: only the script that can dismiss it may show it.
         ============================================================ -->
    <div class="lock" id="lock" hidden>
      <div class="lock__time">
        <p class="lock__date" id="lock-date" aria-hidden="true"></p>
        <p class="lock__clock num" id="lock-clock" aria-hidden="true">--:--</p>
      </div>

      <div class="lock__say">
        <!-- @portfolio-part statement -->
        <!-- A real button: clicking the screen anywhere works, but keyboard and
             screen-reader visitors need something they can land on and press. -->
        <button class="lock__hint" type="button" id="lock-enter">Enter</button>
      </div>
    </div>

    <!-- ============================================================
         MENUBAR
         ============================================================ -->
    <header class="menubar" id="menubar">
      <div class="menubar__left">
        <div class="menu" data-menu>
          <button class="menu__trigger menu__trigger--brand" type="button" aria-expanded="false">
            <span class="mark" aria-hidden="true">JL</span>
            <span class="menu__brand-name">Jayden Lee</span>
          </button>
          <div class="menu__drop" role="menu">
            <button type="button" role="menuitem" data-open="about">About this machine</button>
            <!-- Principles… is hidden with the document, 25 Aug 2026. See
                 vite.config.mjs. Restore this line when the prose is real.
            <button type="button" role="menuitem" data-open="principles">Principles…</button>
            -->
            <button type="button" role="menuitem" data-open="resume">Résumé…</button>
            <div class="menu__sep"></div>
            <a role="menuitem" href="mailto:jeyl@berkeley.edu">Send mail<span class="menu__key">↗</span></a>
            <div class="menu__sep"></div>
            <button type="button" role="menuitem" data-action="tour">Tour with Mpa</button>
            <button type="button" role="menuitem" data-action="lock">Log out</button>
            <button type="button" role="menuitem" data-action="restart">Restart</button>
          </div>
        </div>

        <div class="menu" data-menu>
          <button class="menu__trigger" type="button" aria-expanded="false">Work</button>
          <div class="menu__drop" role="menu">
            <button type="button" role="menuitem" data-open="lea">Lea: LiDAR Enabled Assistant</button>
            <button type="button" role="menuitem" data-open="clinical">Clinical Intervention Simulator</button>
            <button type="button" role="menuitem" data-open="chessblitz">ChessBlitz</button>
            <button type="button" role="menuitem" data-open="site">This website</button>
            <button type="button" role="menuitem" data-open="bearings">bearings</button>
            <div class="menu__sep"></div>
            <button type="button" role="menuitem" data-open="experience">Experience</button>
          </div>
        </div>

        <div class="menu" data-menu>
          <button class="menu__trigger" type="button" aria-expanded="false">View</button>
          <div class="menu__drop" role="menu">
            <button type="button" role="menuitemradio" data-desk="tangerine">Tangerine<span class="swatch" style="--swatch:#f07010"></span></button>
            <button type="button" role="menuitemradio" data-desk="bondi">Bondi<span class="swatch" style="--swatch:#0088ad"></span></button>
            <button type="button" role="menuitemradio" data-desk="grape">Grape<span class="swatch" style="--swatch:#6a2eae"></span></button>
            <button type="button" role="menuitemradio" data-desk="lime">Lime<span class="swatch" style="--swatch:#6cbc2a"></span></button>
            <button type="button" role="menuitemradio" data-desk="strawberry">Strawberry<span class="swatch" style="--swatch:#d41e5a"></span></button>
            <button type="button" role="menuitemradio" data-desk="graphite">Graphite<span class="swatch" style="--swatch:#4e5462"></span></button>
            <div class="menu__sep"></div>
            <button type="button" role="menuitem" data-action="tidy">Tidy desktop</button>
            <button type="button" role="menuitem" data-action="close-all">Close all windows</button>
          </div>
        </div>
      </div>

      <div class="menubar__right">
        <a class="menubar__link menubar__link--home" href="/">Portfolio</a>
        <a class="menubar__link" href="https://github.com/jynlee7" aria-label="GitHub">GitHub</a>
        <a class="menubar__link" href="https://linkedin.com/in/jaydenelee/" aria-label="LinkedIn">LinkedIn</a>
        <!-- The bar clock keeps two times. Pacific is the honest one and the
             default; clicking switches it to Berkeley time, which every class
             on this campus starts ten minutes into. The `BT` mark holds its
             width while hidden so the toggle cannot shove the bar around. -->
        <button
          class="menubar__clock"
          type="button"
          id="bar-clock"
          aria-pressed="false"
          aria-describedby="bar-clock-desc"
        >
          <span class="num" id="bar-time">--:--</span>
          <span class="menubar__bt" aria-hidden="true">BT</span>
          <span class="tip" id="bar-tip" aria-hidden="true"></span>
        </button>
        <span class="sr-only" id="bar-clock-desc"
          >Berkeley time — ten minutes past the hour, when lecture actually
          starts.</span
        >
      </div>
    </header>

    <!-- ============================================================
         DESKTOP
         ============================================================ -->
    <main class="desk" id="desk">
      <!-- Mpa's leader (src/os/mpa.ts). Drawn on the map: first on the desk
           after the field canvas, so the nameplate, icons, rail and windows
           all sit on top of it the way a label sits over a plotted line. -->
      <svg class="mpa-lead" id="mpa-lead" aria-hidden="true" focusable="false" hidden>
        <path class="mpa-lead__casing" pathLength="1" />
        <path class="mpa-lead__line" pathLength="1" />
        <circle class="mpa-lead__dot" r="2.5" />
      </svg>
      <!-- The name, at the foot of the desk at full width. Drawn by the gel canvas
           when there is one; this text stays for everything that reads it, and
           is what shows when there is not. Windows and icons sit over it. -->
      <div class="nameplate">
        <h1 class="nameplate__name"><span class="nameplate__word"><span>Jayden</span></span> <span class="nameplate__word"><span>Lee</span></span></h1>
      </div>

      <!-- Desktop items, the résumé first, where the disk would be. Buttons, so
           they are focusable and openable with the keyboard; the double-click
           affordance is an addition, not the only way in. -->
      <div class="deskcol">
      <div class="icons" id="icons" role="list">
        <button class="icon" type="button" role="listitem" data-open="resume">
          <span class="icon__art"><svg viewBox="0 0 64 64"><use href="#i-pdf" /></svg></span>
          <span class="icon__label">resume<wbr />.pdf</span>
        </button>

        <button class="icon" type="button" role="listitem" data-open="about">
          <span class="icon__art"><svg viewBox="0 0 64 64"><use href="#i-txt" /></svg></span>
          <span class="icon__label">about<wbr />.txt</span>
        </button>

        <button class="icon" type="button" role="listitem" data-open="experience">
          <span class="icon__art"><svg viewBox="0 0 64 64"><use href="#i-log" /></svg></span>
          <span class="icon__label">experience<wbr />.log</span>
        </button>

        <button class="icon" type="button" role="listitem" data-open="lea">
          <span class="icon__art"><svg viewBox="0 0 64 64"><use href="#i-folder" /></svg></span>
          <span class="icon__label">lea</span>
        </button>

        <button class="icon" type="button" role="listitem" data-open="clinical">
          <span class="icon__art"><svg viewBox="0 0 64 64"><use href="#i-folder" /></svg></span>
          <span class="icon__label">clinical-sim</span>
        </button>

        <button class="icon" type="button" role="listitem" data-open="chessblitz">
          <span class="icon__art"><svg viewBox="0 0 64 64"><use href="#i-folder" /></svg></span>
          <span class="icon__label">chessblitz</span>
        </button>

        <button class="icon" type="button" role="listitem" data-open="site">
          <span class="icon__art"><svg viewBox="0 0 64 64"><use href="#i-win" /></svg></span>
          <span class="icon__label">this-site</span>
        </button>

        <!-- Written in content/principles.md, not here. Hidden 25 Aug 2026 while
             the prose is still the scaffold; see vite.config.mjs. Restore this
             button with the entry there.
        <button class="icon" type="button" role="listitem" data-open="principles">
          <span class="icon__art"><svg viewBox="0 0 64 64"><use href="#i-txt" /></svg></span>
          <span class="icon__label">principles.txt</span>
        </button>
        -->
      </div>
      </div>

      <!-- Widget rail. Two widgets, both true: the machine's own clock and
           the weather where Jayden actually is. -->
      <aside class="rail" id="rail" aria-label="Desktop widgets">
        <!-- "Now" means now, and today it holds exactly one thing. Both
             contracts ended, and a widget that keeps calling a finished role
             current is the one lie a hiring manager can catch without leaving
             the page. The degree came out too: it is a fact about Jayden, not
             a post he holds, and it is already in about.txt and
             experience.log. One live line, one dated line under it.
             Rendered from the current role in content/portfolio.mjs by
             scripts/desktop-docs.mjs, so it cannot outlive the role. -->
        <!-- @portfolio-part now -->

        <div class="widget widget--wx" id="wx">
          <p class="widget__title">Berkeley</p>
          <p class="wx__temp num"><span id="wx-temp">—</span>°<span class="wx__unit">F</span></p>
          <p class="wx__cond" id="wx-cond">Loading…</p>
        </div>
      </aside>
    </main>

    <!-- ============================================================
         MPA
         Jayden's personal assistant: a short tour for a first visit,
         driven by src/os/mpa.ts. A window in the machine's own
         material that talks one line at a time; its leader, on the
         desk, points at whatever the line is about. Non-modal, so the
         desk stays live under it. `hidden` until the script that
         can run it shows it — without JS there is nothing to tour.
         ============================================================ -->
    <section class="mpa" id="mpa" role="dialog" aria-labelledby="mpa-title" aria-describedby="mpa-say" hidden>
      <header class="win__bar mpa__bar">
        <button class="win__close" type="button" aria-label="Close Mpa"><span aria-hidden="true">×</span></button>
        <h2 class="win__title" id="mpa-title">mpa</h2>
        <span class="win__meta mpa__count" aria-hidden="true"></span>
      </header>
      <div class="mpa__body">
        <p class="mpa__say" id="mpa-say" aria-live="polite"></p>
        <div class="mpa__actions">
          <button class="mpa__skip" type="button">Skip tour</button>
          <button class="mpa__go" type="button">Next</button>
        </div>
      </div>
    </section>
